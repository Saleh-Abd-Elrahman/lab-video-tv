<!doctype html>
<!-- Admira "URL content": upload this single file as HTML content in the CMS.
     Admira plays it in its own iframe, so all this has to do is hand the whole
     screen to the live page. Duration/loop come from the playlist. -->
<meta charset="utf-8">
<title>Lab TV</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none }
  iframe { display: block; border: 0; width: 100vw; height: 100vh }
</style>
<iframe src="https://lab-video-tv.vercel.app"
        allow="autoplay; encrypted-media; fullscreen"
        allowfullscreen></iframe>
