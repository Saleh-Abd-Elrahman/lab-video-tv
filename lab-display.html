<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lab display</title>
<!--
  Lab display: plays a YouTube playlist on loop and covers the screen with
  logo.png for a few seconds every N videos.

  SETUP
  1. Set PLAYLIST_ID below to the "list=" value from the playlist URL.
        https://www.youtube.com/playlist?list=PLabc123...   ->  'PLabc123...'
  2. Keep all four logos in the same folder as this file. logo.png fills the
     left side; CPL_Logo.png is centred on the right with school1.png and
     AccentColo.png smaller beneath it.
  3. Serve the folder over HTTP — opening the file directly with file:// breaks
     the YouTube embed:
        cd /path/to/this/folder
        python3 -m http.server 8000
  4. Open http://localhost:8000/lab-display.html in the browser, fullscreen.

  Press L at any time to trigger the logo by hand (useful while testing).
-->
<link rel="stylesheet" href="display.css">
<style>
  /* YouTube picks what resolution to fetch from how many pixels the player
     element covers, so PLAYER_WIDTH in the script is what it gets asked for.
     Laid out at that size and scaled to the panel, which is a no-op at 1920.
     Dropping it to 1280 did cure the stutter, but only by handing over half the
     picture — the h264-only extension buys the same headroom back without that,
     so this stays at full resolution. Keep it here as the fallback knob. */
  #player, #player iframe {
    position: fixed; left: 0; top: 0;
    width: var(--player-w, 1280px); height: var(--player-h, 720px);
    transform: scale(var(--player-scale, 1));
    transform-origin: 0 0;
    border: 0;
  }

</style>
</head>
<body>

<div id="player"></div>

<div id="logo" aria-hidden="true">
  <img class="diagram" src="logo.png" alt="">
  <div class="right">
    <div class="top"><img class="wordmark" src="CPL_Logo.png" alt=""></div>
    <div class="small-pair">
      <img class="school" src="school1.png" alt="">
      <img class="iex" src="AccentColo.png" alt="">
    </div>
  </div>
</div>

<script>
/* ---- Settings ------------------------------------------------------ */
const PLAYLIST_ID   = 'PLjxddgZe17mykjPF2kbzCZFfGsw20HU1p';
const EVERY         = 3;      // show the logo after this many videos
const LOGO_SECONDS  = 10;     // how long it stays up
const SHUFFLE       = false;  // true to shuffle the playlist
// Vertical phone-shot clips sit in a thin strip between two black bars on a
// wide panel, so these are passed over without ever going on screen. Same id as
// BURNED_IN_SUBS below: youtube.com/watch?v=dQw4w9WgXcQ -> 'dQw4w9WgXcQ'.
const SKIP_VIDEOS = [
  // 'dQw4w9WgXcQ',
  '91nEFo7FQDw',   // VictorIA Project
  '2KsvCRMe0O8',   // Botzo Project
  'Hl9w9s7gV_c',   // Creating the Website
];
const STALL_SECONDS = 60;     // reload the page if playback stops advancing
const RELOAD_HOURS  = 4;      // start the page over this often, behind a logo card
const PLAYER_WIDTH  = 1920;   // resolution to ask YouTube for
const MAX_QUALITY   = 'hd1080';  // asked for outright as well as by player size

// Videos that already have subtitles burned into the picture — YouTube's own
// captions are switched off for these so the text doesn't appear twice. Use
// the id from the watch URL: youtube.com/watch?v=dQw4w9WgXcQ -> 'dQw4w9WgXcQ'.
const BURNED_IN_SUBS = [
  // 'dQw4w9WgXcQ',
  'TnFKP2k0vCA',
  '5S9eMuWnhj8',
  '91nEFo7FQDw',
  '2KsvCRMe0O8',
  'Hl9w9s7gV_c',
  'Uhx3vMD4bh8',
];
/* ------------------------------------------------------------------- */

// Lay the player out at PLAYER_WIDTH and stretch that over the whole panel.
// A 16:9 screen comes out exact; anything else keeps the width and letterboxes.
function sizePlayer() {
  const style = document.documentElement.style;
  style.setProperty('--player-w', PLAYER_WIDTH + 'px');
  style.setProperty('--player-h', Math.round(PLAYER_WIDTH * 9 / 16) + 'px');
  style.setProperty('--player-scale', innerWidth / PLAYER_WIDTH);
}
sizePlayer();
addEventListener('resize', sizePlayer);

const logoEl = document.getElementById('logo');

let player;
let videosPlayed = 0;
let lastIndex = null;
let showingLogo = false;

// Called by the YouTube API script once it loads.
function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    playerVars: {
      listType: 'playlist',
      list: PLAYLIST_ID,
      loop: 1,              // restart the playlist when it finishes
      autoplay: 1,
      controls: 0,          // hide the player chrome
      disablekb: 1,
      modestbranding: 1,
      iv_load_policy: 3,    // no annotation cards
      rel: 0,
      fs: 0,
      playsinline: 1
    },
    events: {
      onReady: onPlayerReady,
      // The captions module reloads with each video, so re-apply on every start.
      onStateChange: e => {
        if (e.data !== YT.PlayerState.PLAYING || skipListed()) return;
        applyCaptions();
        restoreSound();
        // Belt and braces with the player size above: this one is only a hint
        // and YouTube is free to ignore it, but it costs nothing to ask.
        player.setPlaybackQuality(MAX_QUALITY);
      },
      // An unplayable or embed-blocked video would otherwise stall the loop.
      onError: () => player.nextVideo()
    }
  });
}

function onPlayerReady() {
  if (SHUFFLE) player.setShuffle(true);

  player.unMute();
  player.setVolume(100);   // YouTube remembers a volume of 0 across sessions
  player.playVideo();
  setInterval(watchForVideoChange, 500);

  // Try for sound first: a kiosk browser (or Chrome started with
  // --autoplay-policy=no-user-gesture-required) plays unmuted straight away.
  // Anywhere else the browser refuses, so fall back to a muted start rather
  // than a black screen, and take the sound back on the first touch or key.
  // BUFFERING counts as started: a Pi opening a 1080p embed sits there for well
  // over two seconds, and muting on that left the display silent for the rest of
  // the day with nobody around to click it back.
  setTimeout(() => {
    const state = player.getPlayerState();
    if (state === YT.PlayerState.PLAYING || state === YT.PlayerState.BUFFERING) return;
    player.mute();
    player.playVideo();
    ['click', 'keydown'].forEach(t => document.addEventListener(t, () => {
      player.unMute();
      player.setVolume(100);
      player.playVideo();   // unmuting can cost us the playback, take it back
    }, { once: true }));
  }, 15 * 1000);
}

// Move straight on from the listed clips, before anyone sees them.
let skipsInARow = 0;

function skipListed() {
  const id = player.getVideoData && player.getVideoData().video_id;
  if (!SKIP_VIDEOS.includes(id)) { skipsInARow = 0; return false; }

  // If the list ever covers the whole playlist there is nothing to move on to,
  // so play what we have rather than racing round the loop all night.
  if (++skipsInARow >= (player.getPlaylist() || []).length) return false;

  videosPlayed--;   // a video nobody saw shouldn't count towards the logo card
  player.nextVideo();
  return true;
}

// Off for the videos with subtitles in the picture already, on for the rest.
// 'captions' and 'cc' are the same module under the old and new player names;
// whichever one this player isn't using just ignores the call.
function applyCaptions() {
  const id = player.getVideoData && player.getVideoData().video_id;
  const off = BURNED_IN_SUBS.includes(id);
  ['captions', 'cc'].forEach(m => off ? player.unloadModule(m) : player.loadModule(m));
}

// If the fallback above muted us, don't let that stand for the rest of the day:
// by the next video autoplay is long since granted, so ask for the sound back.
function restoreSound() {
  if (!player.isMuted()) return;
  player.unMute();
  player.setVolume(100);
  player.playVideo();   // unmuting can cost us the playback, take it back
}

// The playlist index tells us when the player has moved to the next video.
function watchForVideoChange() {
  if (showingLogo) return;
  watchForStall();

  const index = player.getPlaylistIndex();
  if (index === lastIndex) return;

  if (lastIndex !== null) {           // don't count the first video's start
    videosPlayed++;
    if (videosPlayed >= EVERY) {
      videosPlayed = 0;
      showLogo();
    }
  }
  lastIndex = index;
}

// A dropped network leaves the embed stuck on an error with no way back, so
// treat a frozen playhead as a dead page and start over. The service worker
// keeps that reload working while the network is still down.
let lastTime = null;
let lastAdvance = 0;

function watchForStall() {
  const t = player.getCurrentTime();
  if (t !== lastTime) {
    lastTime = t;
    lastAdvance = Date.now();
  } else if (Date.now() - lastAdvance > STALL_SECONDS * 1000) {
    location.reload();
  }
}

// The same for a drop that happens before the player exists: without the
// YouTube API script there is no playhead to watch, only a black screen.
setTimeout(() => { if (!player) location.reload(); }, STALL_SECONDS * 1000);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

function showLogo() {
  showingLogo = true;
  player.pauseVideo();
  logoEl.classList.add('visible');

  // Swapping videos through one embed all day leaves the browser heavier every
  // time, and on a small box that shows up as playback going choppy after a few
  // hours. Starting the page over hands the memory back, and doing it while the
  // card is up means the picture was already gone.
  if (performance.now() > RELOAD_HOURS * 3600 * 1000) return location.reload();

  setTimeout(() => {
    logoEl.classList.remove('visible');
    player.playVideo();
    showingLogo = false;
  }, LOGO_SECONDS * 1000);
}

// Manual trigger for testing.
document.addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'l' && !showingLogo && player) showLogo();
});
</script>

<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
