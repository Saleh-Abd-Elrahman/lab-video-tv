<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lab display</title>
<!--
  Lab display: plays a YouTube playlist on loop and covers the screen with
  logo.png for a few seconds every N videos.

  SETUP
  1. Set PLAYLIST_ID below to the "list=" value from the playlist URL.
        https://www.youtube.com/playlist?list=PLabc123...   ->  'PLabc123...'
  2. Keep all four logos in the same folder as this file. logo.png fills the
     left side; CPL_Logo.png is centred on the right with school1.png and
     AccentColo.png smaller beneath it.
  3. Serve the folder over HTTP — opening the file directly with file:// breaks
     the YouTube embed:
        cd /path/to/this/folder
        python3 -m http.server 8000
  4. Open http://localhost:8000/lab-display.html in the browser, fullscreen.

  Press L at any time to trigger the logo by hand (useful while testing).
-->
<style>
  :root {
    --logo-backdrop: #231f20;   /* matches logo.png's own background */
    --logo-gap: 4vw;            /* space between the left logo and right column */
    --logo-pad: 5vh 4vw;        /* breathing room around the card */
    --stack-gap: 1.5vh;         /* wordmark -> the two small logos */
    --small-gap: 2vw;           /* minimum space between the two small logos */
    --small-height: 11vh;       /* height of the small logos' row */
    --small-width: 41%;         /* both small logos render to this width */
    --wordmark-max-h: 50vh;     /* only a guard; the wordmark is width-driven */
    /* Measured ink bounds of CPL_Logo.png: the C starts at 5.2% of the canvas
       and the L ends at 92.8% (margins are uneven, 47px vs 65px). The bottom
       row is inset to match, so it starts under the C and ends under the L. */
    --cpl-ink-start: 5.2%;
    --cpl-ink-span: 87.6%;
    --fade: 700ms;
  }

  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { cursor: none; }

  #player, #player iframe {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh; border: 0;
  }

  /* Logo card sits above the player and fades in and out. */
  #logo {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    gap: var(--logo-gap); padding: var(--logo-pad); box-sizing: border-box;
    background: var(--logo-backdrop);
    opacity: 0; visibility: hidden;
    transition: opacity var(--fade) ease, visibility var(--fade);
  }
  #logo.visible { opacity: 1; visibility: visible; }

  /* Left: the diagram alone, sized by the card's full height. It is square, so
     width follows height and the right column takes whatever is left. */
  #logo .diagram { flex: 0 0 auto; height: 100%; width: auto; object-fit: contain; }

  /* Right: wordmark centred in the upper row, the two small logos beneath it. */
  /* The pad equals exactly what .small-pair plus its gap take off the bottom,
     so .top ends up centred on the card's vertical midline — which is where
     logo.png's horizontal quadrant line falls (measured 1203.5 of 2400, i.e.
     under 1px off centre once rendered). That levels the wordmark with it. */
  #logo .right {
    flex: 1 1 0; min-width: 0; height: 100%; box-sizing: border-box;
    padding-top: calc(var(--small-height) + var(--stack-gap));
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: var(--stack-gap);
  }
  /* .top hugs the wordmark rather than flexing, so the gap below it is exactly
     --stack-gap instead of that plus half the leftover row height. */
  #logo .right .top {
    flex: 0 0 auto; width: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  #logo .right .top img { max-width: 100%; max-height: var(--wordmark-max-h); }

  /* The two small logos have very different aspect ratios (2.68 vs 5.30), so
     left to fill their cells they'd render at wildly different sizes. Capping
     both to one width makes them even; auto margins centre each in its half. */
  /* Inset to the wordmark's ink span and justified to its ends, so the left
     logo starts under the C and the right one finishes under the L. */
  #logo .small-pair {
    flex: 0 0 auto; align-self: flex-start;
    width: var(--cpl-ink-span); margin-left: var(--cpl-ink-start);
    height: var(--small-height);
    display: flex; align-items: center; justify-content: space-between;
    gap: var(--small-gap);
  }
  #logo .small-pair img {
    flex: 0 0 auto; max-width: var(--small-width); max-height: 100%;
  }

  /* CPL_Logo.png is black-on-white, the inverse of logo.png's white-on-dark.
     Inverting it gives white-on-black, and screen blending drops that black
     into the backdrop, so both logos sit on one seamless dark card. */
  #logo .wordmark { filter: invert(1); mix-blend-mode: screen; }

  /* school1.png is black artwork on transparency, so inverting alone turns it
     white — no blend mode needed, the transparency already lets the card show.
     Plain invert is required here: the "ie" is knocked out of a solid disc, and
     flattening to a silhouette first would swallow the letters. */
  #logo .school { filter: invert(1); }

  /* AccentColo.png is navy (#000066) on transparency, which would read as near
     black on this backdrop. brightness(0) flattens it to a silhouette and
     invert(1) turns that white, matching the other three. Safe here because
     the wordmark has no knocked-out detail to lose. */
  #logo .iex { filter: brightness(0) invert(1); }

  /* Browsers block sound until someone interacts with the page once. */
  #start {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: #000; color: #9a9a9a; cursor: pointer;
    font: 400 1.5rem/1.4 system-ui, sans-serif; letter-spacing: 0.02em;
  }
  #start:focus-visible { outline: 2px solid #9a9a9a; outline-offset: -8px; }

  @media (prefers-reduced-motion: reduce) { :root { --fade: 0ms; } }
</style>
</head>
<body>

<div id="player"></div>

<div id="logo" aria-hidden="true">
  <img class="diagram" src="logo.png" alt="">
  <div class="right">
    <div class="top"><img class="wordmark" src="CPL_Logo.png" alt=""></div>
    <div class="small-pair">
      <img class="school" src="school1.png" alt="">
      <img class="iex" src="AccentColo.png" alt="">
    </div>
  </div>
</div>

<button id="start" type="button">Click to start the display</button>

<script>
/* ---- Settings ------------------------------------------------------ */
const PLAYLIST_ID   = 'PLjxddgZe17mykjPF2kbzCZFfGsw20HU1p';
const EVERY         = 3;      // show the logo after this many videos
const LOGO_SECONDS  = 10;     // how long it stays up
const SHUFFLE       = false;  // true to shuffle the playlist

// Videos that already have subtitles burned into the picture — YouTube's own
// captions are switched off for these so the text doesn't appear twice. Use
// the id from the watch URL: youtube.com/watch?v=dQw4w9WgXcQ -> 'dQw4w9WgXcQ'.
const BURNED_IN_SUBS = [
  // 'dQw4w9WgXcQ',
  'TnFKP2k0vCA',
  '5S9eMuWnhj8',
  '91nEFo7FQDw',
  '2KsvCRMe0O8',
  'Hl9w9s7gV_c',
  'Uhx3vMD4bh8',
];
/* ------------------------------------------------------------------- */

const logoEl  = document.getElementById('logo');
const startEl = document.getElementById('start');

let player;
let videosPlayed = 0;
let lastIndex = null;
let showingLogo = false;

// Called by the YouTube API script once it loads.
function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    playerVars: {
      listType: 'playlist',
      list: PLAYLIST_ID,
      loop: 1,              // restart the playlist when it finishes
      autoplay: 1,
      controls: 0,          // hide the player chrome
      disablekb: 1,
      modestbranding: 1,
      iv_load_policy: 3,    // no annotation cards
      rel: 0,
      fs: 0,
      playsinline: 1
    },
    events: {
      onReady: onPlayerReady,
      // The captions module reloads with each video, so re-apply on every start.
      onStateChange: e => { if (e.data === YT.PlayerState.PLAYING) applyCaptions(); },
      // An unplayable or embed-blocked video would otherwise stall the loop.
      onError: () => player.nextVideo()
    }
  });
}

function onPlayerReady() {
  if (SHUFFLE) player.setShuffle(true);

  startEl.addEventListener('click', () => {
    startEl.remove();
    player.playVideo();
    setInterval(watchForVideoChange, 500);
  });
  startEl.focus();
}

// Off for the videos with subtitles in the picture already, on for the rest.
// 'captions' and 'cc' are the same module under the old and new player names;
// whichever one this player isn't using just ignores the call.
function applyCaptions() {
  const id = player.getVideoData && player.getVideoData().video_id;
  const off = BURNED_IN_SUBS.includes(id);
  ['captions', 'cc'].forEach(m => off ? player.unloadModule(m) : player.loadModule(m));
}

// The playlist index tells us when the player has moved to the next video.
function watchForVideoChange() {
  if (showingLogo) return;

  const index = player.getPlaylistIndex();
  if (index === lastIndex) return;

  if (lastIndex !== null) {           // don't count the first video's start
    videosPlayed++;
    if (videosPlayed >= EVERY) {
      videosPlayed = 0;
      showLogo();
    }
  }
  lastIndex = index;
}

function showLogo() {
  showingLogo = true;
  player.pauseVideo();
  logoEl.classList.add('visible');

  setTimeout(() => {
    logoEl.classList.remove('visible');
    player.playVideo();
    showingLogo = false;
  }, LOGO_SECONDS * 1000);
}

// Manual trigger for testing.
document.addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'l' && !showingLogo && player) showLogo();
});
</script>

<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
